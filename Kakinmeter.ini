[Rainmeter]
Update=1000
Accumulate=0
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=Bionic Cloud Credits Bar
Author=Ornith
Information=Bionic Cloud weekly usage display with countdown
License=Personal use
Version=2.3

[Variables]
STATUS_FILE=#CURRENTPATH#cloud_status.txt
CardWidth=460
CardHeight=115
BarWidth=420
BarHeight=8
FontFace=Yu Gothic UI

; --- Data source ---

[measureFile]
Measure=WebParser
URL=file://#STATUS_FILE#
RegExp=(?siU)title=(.*)\Rplan=(.*)\Rpct=(.*)\Rrem=(.*)\Rlimit=(.*)\Rreset=(.*)\Rr_day=(.*)\Rr_hour=(.*)\Rr_min=(.*)\R
UpdateRate=5

[measurePlan]
Measure=WebParser
URL=[measureFile]
StringIndex=2

[measurePct]
Measure=WebParser
URL=[measureFile]
StringIndex=3
MinValue=0
MaxValue=100

[measureRem]
Measure=WebParser
URL=[measureFile]
StringIndex=4

[measureLimit]
Measure=WebParser
URL=[measureFile]
StringIndex=5

[measureReset]
Measure=WebParser
URL=[measureFile]
StringIndex=6

[measureRDay]
Measure=WebParser
URL=[measureFile]
StringIndex=7

[measureRHour]
Measure=WebParser
URL=[measureFile]
StringIndex=8

[measureRMin]
Measure=WebParser
URL=[measureFile]
StringIndex=9

; Bar turns red when 20% or less remains, purple otherwise
[measureBarColor]
Measure=Calc
Formula=measurePct <= 20 ? 1 : 0
IfCondition=measurePct <= 20
IfTrueAction=[!SetVariable BarColor "239,68,68,255"]
IfFalseAction=[!SetVariable BarColor "118,92,246,255"]
DynamicVariables=1

; --- Styles ---

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=235,235,240,255
FontFace=#FontFace#
FontSize=11
AntiAlias=1

[stylePct]
StringAlign=Right
StringStyle=Bold
FontColor=235,235,240,255
FontFace=#FontFace#
FontSize=11
AntiAlias=1

[styleSub]
StringAlign=Left
FontColor=155,160,170,255
FontFace=#FontFace#
FontSize=9
AntiAlias=1

[styleSubRight]
StringAlign=Right
StringStyle=Bold
FontColor=235,235,240,255
FontFace=#FontFace#
FontSize=9
AntiAlias=1

; --- Display ---

[meterCardBg]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#CardWidth#,#CardHeight#,10 | Fill Color 32,33,39,245 | StrokeWidth 1 | Stroke Color 48,50,58,255

; Top-left: title and plan name
[meterLabel]
Meter=String
MeterStyle=styleLabel
MeasureName=measurePlan
Text=Weekly usage limit (%1)
X=20
Y=18

; Top-right: remaining credits and percentage
[meterPctText]
Meter=String
MeterStyle=stylePct
MeasureName=measureRem
MeasureName2=measureLimit
MeasureName3=measurePct
Text=Left %1 / %2 (%3%)
X=(#CardWidth#-20)
Y=18

; Bar background track
[meterBarTrack]
Meter=Shape
X=20
Y=52
Shape=Rectangle 0,0,#BarWidth#,#BarHeight#,4 | Fill Color 52,54,64,255 | StrokeWidth 0

; Progress bar fill (scales with pct, colored by measureBarColor)
[meterBarFill]
Meter=Shape
X=20
Y=52
Shape=Rectangle 0,0,(#BarWidth#*([measurePct:]/100)),#BarHeight#,4 | Fill Color #BarColor# | StrokeWidth 0
DynamicVariables=1

; Bottom-left: reset date/time (local timezone)
[meterResetText]
Meter=String
MeterStyle=styleSub
MeasureName=measureReset
Text=Resets at %1
X=20
Y=78

; Bottom-right: countdown to reset (days, hours, minutes)
[meterResetCountdown]
Meter=String
MeterStyle=styleSubRight
MeasureName=measureRDay
MeasureName2=measureRHour
MeasureName3=measureRMin
Text=Resets in %1 d %2 h %3 m
X=(#CardWidth#-20)
Y=78
